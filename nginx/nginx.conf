upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ── Backend: rutas de API + WebSocket de Socket.IO ─────────────────────
    # Todas las rutas conocidas del backend NestJS
    location ~* ^/(auth|users|cameras|vehicles|detections|reports|alerts|backups|sanctions|sanction-definitions|access-points|permissions|roles|uploads|socket\.io) {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;

        # Soporte WebSocket (Socket.IO)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Frontend: todo lo demás va a Next.js ───────────────────────────────
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
