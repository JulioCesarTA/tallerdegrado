services:

  # ── Base de datos ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       control_vehicular
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d control_vehicular"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend NestJS ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:              production
      PORT:                  3001
      DATABASE_URL:          postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/control_vehicular?schema=public
      JWT_SECRET:            ${JWT_SECRET}
      FRONTEND_URL:          http://${EC2_HOST}
      BACKEND_URL:           http://${EC2_HOST}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION:             ${AWS_REGION}
      AWS_REKOGNITION_REGION: ${AWS_REKOGNITION_REGION}
      AWS_S3_BUCKET:          ${AWS_S3_BUCKET}
      AWS_S3_EVIDENCE_PREFIX: ${AWS_S3_EVIDENCE_PREFIX}
      AWS_S3_BACKUP_PREFIX:   ${AWS_S3_BACKUP_PREFIX}
      CLAUDE_API_KEY:         ${CLAUDE_API_KEY}
      CLAUDE_MODEL:           ${CLAUDE_MODEL}
      GMAIL_USER:             ${GMAIL_USER}
      GMAIL_APP_PASSWORD:     ${GMAIL_APP_PASSWORD}
    networks:
      - app-network

  # ── Frontend Next.js ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${EC2_HOST}
    container_name: cv_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  # ── Metabase (BI) ──────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cv_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

# ── Redes y volúmenes ─────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  metabase-data:
    external: true
